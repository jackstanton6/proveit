topic:
  id: graph-theory
  name: Graph theory
  order: 7
  prefix: gt
  blurb: Degrees, trees, connectivity, Euler and Hamilton, colouring and planarity, matchings and Ramsey numbers.
  subtopics: [Degrees, Trees, Connectivity, Euler & Hamilton, Colouring & planarity, Matchings & Ramsey]

problems:
  - id: gt-001
    title: The handshake lemma
    subtopic: Degrees
    difficulty: easy
    type: proof
    tags: [degrees, double counting]
    related: [gt-002]
    statement: |
      Prove that in any finite graph $G = (V, E)$, $\displaystyle\sum_{v \in V}\deg(v) = 2|E|$. Deduce that the number of odd-degree vertices is even.
    solution: |
      Count pairs $(v, e)$ with $v$ an endpoint of edge $e$. Each vertex $v$ is in $\deg(v)$ such pairs, giving $\sum_v \deg(v)$. Each edge has exactly two endpoints, giving $2|E|$. (A loop counts twice towards its vertex's degree, so this still holds.)

      Split the sum into even- and odd-degree vertices. The total and the even part are both even, so the sum of the odd degrees is even. A sum of odd numbers is even only if there is an even number of terms. $\blacksquare$

  - id: gt-002
    title: Handshakes at a party
    subtopic: Degrees
    difficulty: easy
    type: compute
    tags: [degrees, handshake lemma]
    related: [gt-001]
    statement: |
      Is it possible for 9 people at a party to each shake hands with exactly 3 others? With exactly 4 others?
    solution: |
      Model people as vertices and handshakes as edges.

      - **3 each: impossible.** The degree sum would be $9 \cdot 3 = 27$, which is odd, but it must equal $2|E|$.
      - **4 each: possible.** Seat everyone in a circle, $0, 1, \dots, 8$, and let each person shake hands with the two people on either side: $i$ with $i\pm1$ and $i \pm 2 \pmod 9$. Everyone has degree 4.

  - id: gt-003
    title: Which degree sequences are graphic?
    subtopic: Degrees
    difficulty: medium
    type: compute
    tags: [degree sequences, havel-hakimi]
    statement: |
      Decide whether a simple graph exists with each degree sequence. If one does, describe it.

      1. $(3, 3, 3, 3, 3)$
      2. $(4, 4, 4, 1, 1)$
      3. $(3, 3, 2, 2, 2)$
    solution: |
      1. **No.** The sum $15$ is odd.
      2. **No.** On 5 vertices, a vertex of degree 4 is adjacent to every other vertex. With three such vertices, each degree-1 vertex would have degree at least 3.
      3. **Yes.** Take the 5-cycle $a\,c\,b\,e\,d\,a$ (every vertex has degree 2) and add the chord $ab$. Then $a, b$ have degree 3 and $c, d, e$ have degree 2.

  - id: gt-004
    title: Two vertices of equal degree
    subtopic: Degrees
    difficulty: easy
    type: proof
    tags: [degrees, pigeonhole]
    statement: |
      Prove that every simple graph with $n \ge 2$ vertices has two vertices of the same degree.
    solution: |
      Degrees lie in $\{0, 1, \dots, n-1\}$. But $0$ and $n - 1$ cannot both occur: a vertex of degree $n-1$ is adjacent to every other vertex, so no vertex has degree $0$. So the $n$ degrees take at most $n - 1$ distinct values, and by pigeonhole two coincide. $\blacksquare$

  - id: gt-005
    title: Enough edges force connectivity
    subtopic: Connectivity
    difficulty: medium
    type: proof
    tags: [connectivity, extremal]
    statement: |
      Prove that a simple graph with $n$ vertices and more than $\binom{n-1}{2}$ edges is connected. Show the bound is sharp.
    solution: |
      Suppose $G$ is disconnected. Then $V$ splits into non-empty parts $A$ and $B$, $|A| = k$, $|B| = n-k$ with $1 \le k \le n - 1$, and no edges between them. So
      $$|E| \le \binom k2 + \binom{n-k}{2} = \binom n2 - k(n-k).$$
      Now $k(n-k) - (n-1) = (k-1)(n-k-1) \ge 0$, so $|E| \le \binom n2 - (n-1) = \binom{n-1}{2}$. Contrapositively, more edges than this forces connectivity.

      **Sharp:** $K_{n-1}$ plus an isolated vertex has exactly $\binom{n-1}{2}$ edges and is disconnected. $\blacksquare$

  - id: gt-006
    title: Counting walks with the adjacency matrix
    subtopic: Connectivity
    difficulty: medium
    type: compute
    tags: [adjacency matrix, walks, triangles]
    related: [la-021]
    statement: |
      Let $A$ be the adjacency matrix of a graph. It is a fact that $(A^k)_{ij}$ is the number of walks of length $k$ from $i$ to $j$. Explain why, and use it to show that $\tr(A^3) = 6 \times (\text{number of triangles})$. Check this for $K_4$.
    solution: |
      **Why.** Induct on $k$. $(A^{k+1})_{ij} = \sum_\ell (A^k)_{i\ell}A_{\ell j}$. A walk of length $k + 1$ from $i$ to $j$ is a walk of length $k$ from $i$ to some $\ell$ followed by an edge $\ell j$, and the sum counts exactly these.

      **Triangles.** $(A^3)_{ii}$ counts closed walks $i \to a \to b \to i$. In a simple graph these are exactly triangles through $i$ traversed in one of 2 directions. Summing over $i$, each triangle is counted once for each of its 3 vertices and 2 directions: $\tr(A^3) = 6T$.

      **$K_4$.** $A = J - I$, where $J$ is the all-ones matrix and $J^2 = 4J$. Then $A^2 = J^2 - 2J + I = 2J + I$ and $A^3 = (2J + I)(J - I) = 2J^2 - 2J + J - I = 7J - I$. So $\tr(A^3) = 4 \cdot 6 = 24 = 6 \cdot 4$, and $K_4$ indeed has $\binom43 = 4$ triangles.

  - id: gt-007
    title: Trees have n − 1 edges
    subtopic: Trees
    difficulty: medium
    type: proof
    tags: [trees, induction, leaves]
    related: [gt-008, gt-009]
    statement: |
      Prove that every tree with $n \ge 1$ vertices has exactly $n - 1$ edges. (You may use that every tree with at least 2 vertices has a leaf.)
    solution: |
      Induct on $n$. A tree with one vertex has no edges.

      For $n \ge 2$, let $v$ be a leaf, with unique neighbour $u$. $T - v$ is still connected: a path between two other vertices never passes through $v$, since an interior vertex of a path has degree at least 2. It is still acyclic. So $T - v$ is a tree with $n - 1$ vertices and, by hypothesis, $n - 2$ edges. Adding back $v$ and the edge $uv$ gives $n - 1$ edges. $\blacksquare$

  - id: gt-008
    title: Trees have at least two leaves
    subtopic: Trees
    difficulty: easy
    type: proof
    tags: [trees, longest path, leaves]
    related: [gt-007]
    statement: |
      Prove that every tree with at least two vertices has at least two leaves.
    solution: |
      A tree with $\ge 2$ vertices is connected, so it has an edge and hence a path with at least one edge. Let $P = v_0 v_1 \cdots v_k$ be a longest path ($k \ge 1$).

      Consider $v_0$. It is adjacent to $v_1$. If it were adjacent to a vertex $w$ not on $P$, then $w v_0 \cdots v_k$ would be a longer path. If it were adjacent to some $v_i$ with $i \ge 2$, then $v_0 v_1 \cdots v_i v_0$ would be a cycle. So $\deg v_0 = 1$, and by the same argument $\deg v_k = 1$. Since $v_0 \ne v_k$, there are two leaves. $\blacksquare$

  - id: gt-009
    title: Connected with n − 1 edges means tree
    subtopic: Trees
    difficulty: medium
    type: proof
    tags: [trees, spanning tree]
    related: [gt-007, gt-013]
    statement: |
      Prove that a connected graph with $n$ vertices and $n - 1$ edges is a tree.
    solution: |
      Let $G$ be connected with $n - 1$ edges. If $G$ had a cycle, removing one edge of that cycle would leave $G$ connected: any walk using the removed edge $xy$ can detour around the rest of the cycle. Repeat while cycles remain. The process ends, since edges are finite, at a connected acyclic spanning subgraph: a tree on $n$ vertices, which has $n - 1$ edges.

      But we removed at least one edge, so the tree has at most $n - 2$ edges, a contradiction. Hence $G$ is acyclic, so it is a tree. $\blacksquare$

  - id: gt-010
    title: Unique paths in trees
    subtopic: Trees
    difficulty: easy
    type: proof
    tags: [trees, paths, cycles]
    statement: |
      Prove that in a tree there is exactly one path between any two vertices.
    solution: |
      A path exists because trees are connected. Suppose $P$ and $Q$ are two different paths from $u$ to $v$. Follow them from $u$ until they first differ: say they agree up to vertex $x$, and then $P$ goes to $p$ and $Q$ goes to $q \ne p$. (This happens because two different paths from $u$ to $v$ can't be such that one is an initial segment of the other.) Let $y$ be the first vertex after $x$ on $P$ that also lies on $Q$ after $x$; one exists because $v$ is on both. The portion of $P$ from $x$ to $y$ and the portion of $Q$ from $y$ back to $x$ share only $x$ and $y$, so together they form a cycle. This contradicts acyclicity. $\blacksquare$

  - id: gt-011
    title: Counting leaves
    subtopic: Trees
    difficulty: easy
    type: compute
    tags: [trees, handshake lemma]
    statement: |
      A tree has exactly 10 vertices of degree 3 and every other vertex is a leaf. How many leaves does it have?
    solution: |
      Let $L$ be the number of leaves, so $n = 10 + L$ and $|E| = n - 1 = 9 + L$. By the handshake lemma,
      $$10\cdot 3 + L\cdot 1 = 2(9 + L) \implies 30 + L = 18 + 2L \implies L = 12.$$

  - id: gt-012
    title: Labelled trees on four vertices
    subtopic: Trees
    difficulty: medium
    type: compute
    tags: [trees, counting, cayley]
    statement: |
      How many trees are there with vertex set $\{1, 2, 3, 4\}$? Compare with Cayley's formula $n^{n-2}$.
    solution: |
      A tree on 4 vertices has 3 edges. Its degrees sum to 6, and the shape is either a path or a star.

      - **Stars** $K_{1,3}$: determined by the centre, giving $4$.
      - **Paths** $P_4$: an ordering of the 4 vertices, with each path counted twice (forwards and backwards), giving $4!/2 = 12$.

      Total **16** $= 4^{4-2}$, as Cayley's formula predicts.

  - id: gt-013
    title: Spanning trees exist
    subtopic: Trees
    difficulty: medium
    type: proof
    tags: [spanning tree, connectivity]
    related: [gt-009]
    statement: |
      Prove that every connected finite graph has a spanning tree.
    solution: |
      Among all connected spanning subgraphs of $G$ (there is at least one, $G$ itself), choose one, $H$, with the fewest edges. If $H$ had a cycle, deleting an edge $xy$ of that cycle would keep $H$ connected (any walk through $xy$ can use the rest of the cycle instead), contradicting minimality. So $H$ is connected and acyclic, i.e. a spanning tree. $\blacksquare$

  - id: gt-014
    title: Walks contain paths
    subtopic: Connectivity
    difficulty: easy
    type: proof
    tags: [walks, paths]
    statement: |
      Prove that if a graph contains a walk from $u$ to $v$, then it contains a path from $u$ to $v$.
    solution: |
      Among all $u$–$v$ walks choose a shortest one, $W = w_0 w_1 \cdots w_k$. If some vertex repeated, $w_i = w_j$ with $i < j$, then $w_0 \cdots w_i w_{j+1} \cdots w_k$ would be a shorter $u$–$v$ walk. So no vertex repeats and $W$ is a path. $\blacksquare$

  - id: gt-015
    title: Bipartite iff no odd cycles
    subtopic: Connectivity
    difficulty: hard
    type: proof
    tags: [bipartite, cycles, distance]
    source: König, 1936
    hints:
      - |
        First show that a closed walk of odd length contains an odd cycle.
      - |
        For the converse, colour each vertex by the parity of its distance from a fixed root.
    statement: |
      Prove that a graph is bipartite if and only if it contains no cycle of odd length.
    solution: |
      **($\Rightarrow$)** Along any cycle, the sides alternate, so returning to the start takes an even number of steps.

      **Lemma.** Every closed walk of odd length contains an odd cycle. Induct on the length. If no vertex repeats (other than start = end), the walk is a cycle. Otherwise, splitting at a repeated vertex gives two shorter closed walks whose lengths add to an odd number, so one of them is odd and contains an odd cycle by hypothesis.

      **($\Leftarrow$)** It suffices to 2-colour each component. Fix a vertex $r$ and colour $x$ by the parity of $d(r, x)$. Suppose an edge $xy$ joined two vertices of the same colour. Since $|d(r,x) - d(r,y)| \le 1$ for adjacent vertices, $d(r,x) = d(r,y) = d$. Then a shortest $r$–$x$ path, the edge $xy$, and a shortest $y$–$r$ path form a closed walk of length $2d + 1$, which is odd. By the lemma, $G$ has an odd cycle, a contradiction. $\blacksquare$

  - id: gt-016
    title: A graph or its complement is connected
    subtopic: Connectivity
    difficulty: medium
    type: proof
    tags: [complement, connectivity]
    statement: |
      Prove that for every graph $G$, at least one of $G$ and its complement $\overline G$ is connected.
    solution: |
      Suppose $G$ is disconnected; we show $\overline G$ is connected. Take vertices $u, v$.

      - If $u, v$ are in different components of $G$, they are not adjacent in $G$, so $uv$ is an edge of $\overline G$.
      - If they are in the same component $C$, pick $w$ in another component (one exists, as $G$ is disconnected). Then $uw$ and $wv$ are non-edges of $G$, so $u\,w\,v$ is a path in $\overline G$. $\blacksquare$

  - id: gt-017
    title: Euler's theorem on circuits
    subtopic: Euler & Hamilton
    difficulty: hard
    type: proof
    tags: [eulerian, induction, cycles]
    source: Euler, 1736
    related: [gt-018]
    hints:
      - |
        For sufficiency: a graph with minimum degree $\ge 2$ contains a cycle. Remove a cycle's edges, then apply induction to each remaining component.
    statement: |
      Let $G$ be a connected graph with at least one edge. Prove that $G$ has an Eulerian circuit (a closed walk using every edge exactly once) if and only if every vertex has even degree.
    solution: |
      **($\Rightarrow$)** Traverse the circuit. Each time it passes through a vertex it uses one edge in and one edge out, and the start/end pair up in the same way. Every edge is used exactly once, so each degree is even.

      **($\Leftarrow$)** Induct on $|E|$. Every vertex has even degree, and since $G$ is connected with an edge, every degree is at least 2. Then $G$ contains a cycle $C$: take a longest path; its endpoint has a second neighbour, which must lie on the path.

      Delete the edges of $C$. Every degree drops by $0$ or $2$, so it stays even. Each component of what remains that has an edge has fewer edges than $G$, so by hypothesis it has an Eulerian circuit. Each such component shares a vertex with $C$, since $G$ was connected.

      Now walk around $C$. The first time you reach a vertex of some component, detour around that component's Eulerian circuit and return to the same vertex, then continue along $C$. This uses every edge exactly once. $\blacksquare$

  - id: gt-018
    title: Euler trails in small graphs
    subtopic: Euler & Hamilton
    difficulty: easy
    type: compute
    tags: [eulerian, degrees]
    related: [gt-017]
    statement: |
      A connected graph has an Euler **trail** (not necessarily closed) iff it has $0$ or $2$ odd-degree vertices. Decide which of $K_4$, $K_5$, $K_{2,3}$ have an Euler circuit, an Euler trail, or neither.
    solution: |
      - $K_4$: all four vertices have degree 3, so 4 odd vertices: **neither**.
      - $K_5$: all degrees 4: **Euler circuit**.
      - $K_{2,3}$: the two vertices on the small side have degree 3, the other three degree 2. Exactly two odd vertices: **Euler trail** (starting and ending at the degree-3 vertices), no circuit.

  - id: gt-019
    title: Hypercubes are Hamiltonian
    subtopic: Euler & Hamilton
    difficulty: medium
    type: proof
    tags: [hamiltonian, hypercube, gray code, induction]
    statement: |
      The hypercube $Q_n$ has vertex set $\{0,1\}^n$, with two strings adjacent iff they differ in exactly one position. Prove that $Q_n$ has a Hamiltonian cycle for every $n \ge 2$.
    solution: |
      Induct on $n$. $Q_2$ is the 4-cycle $00, 01, 11, 10$.

      Suppose $v_1, v_2, \dots, v_{2^n}$ is a Hamiltonian cycle of $Q_n$: consecutive strings differ in one bit, as do $v_{2^n}$ and $v_1$. In $Q_{n+1}$ take
      $$0v_1,\ 0v_2,\ \dots,\ 0v_{2^n},\ 1v_{2^n},\ 1v_{2^n - 1},\ \dots,\ 1v_1,$$
      and back to $0v_1$. Each step changes one bit: within each half by hypothesis, and at the two joins ($0v_{2^n} \to 1v_{2^n}$ and $1v_1 \to 0v_1$) only the first bit changes. All $2^{n+1}$ strings appear exactly once. $\blacksquare$

      (This is the binary reflected Gray code.)

  - id: gt-020
    title: Hamiltonian complete bipartite graphs
    subtopic: Euler & Hamilton
    difficulty: medium
    type: proof
    tags: [hamiltonian, bipartite]
    statement: |
      Prove that $K_{m,n}$ (with $m, n \ge 1$) has a Hamiltonian cycle if and only if $m = n \ge 2$.
    solution: |
      **($\Rightarrow$)** A cycle in a bipartite graph alternates between the parts, so it contains equally many vertices from each. A Hamiltonian cycle contains all vertices, so $m = n$. A cycle has at least 4 vertices in a bipartite graph, so $m = n \ge 2$.

      **($\Leftarrow$)** With parts $\{a_1, \dots, a_n\}$ and $\{b_1, \dots, b_n\}$, $n \ge 2$, the cycle $a_1 b_1 a_2 b_2 \cdots a_n b_n a_1$ uses only edges between the parts, all of which exist, and visits every vertex once. $\blacksquare$

  - id: gt-021
    title: Euler's formula for planar graphs
    subtopic: Colouring & planarity
    difficulty: hard
    type: proof
    tags: [planar, euler formula, induction]
    source: Euler
    related: [gt-022, gt-023]
    statement: |
      Prove that for a connected plane graph with $v$ vertices, $e$ edges and $f$ faces (including the outer face), $v - e + f = 2$. You may use the Jordan curve theorem: a cycle drawn in the plane separates it into exactly two regions.
    solution: |
      Induct on $e$.

      **If $G$ is a tree**, then $e = v - 1$, and since there is no cycle there is only one face, $f = 1$. So $v - e + f = v - (v-1) + 1 = 2$.

      **Otherwise** $G$ has a cycle $C$; let $xy$ be an edge of $C$. By the Jordan curve theorem $C$ separates the plane into an inside and an outside, so the two sides of $xy$ lie in different faces. Deleting $xy$ merges these two faces into one, and $G - xy$ is still connected (go around the rest of $C$). So $G - xy$ has $v$ vertices, $e - 1$ edges, $f - 1$ faces, and by hypothesis
      $$v - (e-1) + (f - 1) = 2 \implies v - e + f = 2. \qquad \blacksquare$$

  - id: gt-022
    title: K5 is not planar
    subtopic: Colouring & planarity
    difficulty: medium
    type: proof
    tags: [planar, euler formula]
    related: [gt-021, gt-023]
    statement: |
      Prove that a simple planar graph with $v \ge 3$ vertices has at most $3v - 6$ edges, and deduce that $K_5$ is not planar.
    solution: |
      We may assume $G$ is connected (adding edges to connect components keeps it planar and only increases $e$). If $e < 3$, then $e \le 2 \le 3v - 6$ since $v \ge 3$. Otherwise each face is bounded by at least 3 edges (no loops or multiple edges), and each edge borders at most 2 faces, so counting edge–face incidences gives $3f \le 2e$. By Euler's formula,
      $$2 = v - e + f \le v - e + \tfrac23 e \implies e \le 3v - 6.$$
      $K_5$ has $v = 5$ and $e = 10 > 9 = 3\cdot5 - 6$, so it is not planar. $\blacksquare$

  - id: gt-023
    title: K3,3 is not planar
    subtopic: Colouring & planarity
    difficulty: medium
    type: proof
    tags: [planar, euler formula, bipartite]
    related: [gt-022]
    statement: |
      Prove that $K_{3,3}$ is not planar.
    solution: |
      Suppose it had a plane drawing. It is connected with $v = 6$, $e = 9$, so by Euler's formula $f = 2 - v + e = 5$.

      $K_{3,3}$ is bipartite, so it has no odd cycles, and in particular no triangles. Every face is therefore bounded by at least 4 edges. Each edge borders at most 2 faces, so $4f \le 2e$, i.e. $20 \le 18$. Contradiction. $\blacksquare$

  - id: gt-024
    title: A vertex of degree at most five
    subtopic: Colouring & planarity
    difficulty: easy
    type: proof
    tags: [planar, degrees]
    related: [gt-022, gt-025]
    statement: |
      Prove that every simple planar graph has a vertex of degree at most 5.
    solution: |
      If $v \le 2$ every degree is at most 1. Otherwise $e \le 3v - 6$. If every vertex had degree $\ge 6$, then by the handshake lemma $2e \ge 6v$, so $e \ge 3v > 3v - 6$. Contradiction. $\blacksquare$

  - id: gt-025
    title: The six colour theorem
    subtopic: Colouring & planarity
    difficulty: medium
    type: proof
    tags: [colouring, planar, induction]
    related: [gt-024]
    statement: |
      Prove that every simple planar graph can be properly coloured with 6 colours.
    solution: |
      Induct on the number of vertices. A graph with at most 6 vertices is trivially 6-colourable.

      Let $G$ be planar. By the previous result it has a vertex $v$ with $\deg v \le 5$. $G - v$ is planar with fewer vertices, so by hypothesis it has a proper 6-colouring. The at most 5 neighbours of $v$ use at most 5 colours, so a sixth colour is free for $v$. This gives a proper 6-colouring of $G$. $\blacksquare$

  - id: gt-026
    title: Chromatic numbers
    subtopic: Colouring & planarity
    difficulty: easy
    type: compute
    tags: [colouring, chromatic number]
    statement: |
      Find the chromatic number of $K_n$, $C_5$, $C_6$, $K_{3,4}$ and the wheel $W_5$ (a 5-cycle plus a hub adjacent to all five rim vertices).
    solution: |
      - $\chi(K_n) = n$: all vertices are mutually adjacent.
      - $\chi(C_6) = 2$: alternate colours around the even cycle.
      - $\chi(C_5) = 3$: an odd cycle is not bipartite, so needs at least 3; colour $1,2,1,2,3$.
      - $\chi(K_{3,4}) = 2$: bipartite with at least one edge.
      - $\chi(W_5) = 4$: the rim is $C_5$ and needs 3 colours. The hub is adjacent to every rim vertex, so it needs a 4th.

  - id: gt-027
    title: Greedy colouring
    subtopic: Colouring & planarity
    difficulty: easy
    type: proof
    tags: [colouring, greedy algorithm, max degree]
    statement: |
      Prove that every graph with maximum degree $\Delta$ satisfies $\chi(G) \le \Delta + 1$.
    solution: |
      List the vertices in any order and colour them one at a time, giving each the smallest colour in $\{1, \dots, \Delta + 1\}$ not used by its already-coloured neighbours. A vertex has at most $\Delta$ neighbours, so at most $\Delta$ colours are forbidden and one is always free. The result is a proper colouring with at most $\Delta + 1$ colours. $\blacksquare$

  - id: gt-028
    title: A recursive bound for Ramsey numbers
    subtopic: Matchings & Ramsey
    difficulty: hard
    type: proof
    tags: [ramsey, pigeonhole, induction]
    source: Erdős–Szekeres, 1935
    related: [cb-014]
    statement: |
      Let $R(s,t)$ be the least $N$ such that every red/blue colouring of the edges of $K_N$ contains a red $K_s$ or a blue $K_t$. Prove that for $s, t \ge 3$,
      $$R(s,t) \le R(s-1,t) + R(s, t-1),$$
      and deduce that $R(s, t)$ exists for all $s, t \ge 2$ and that $R(3,3) \le 6$.
    solution: |
      **Base values.** $R(s, 2) = s$: in a colouring of $K_s$, either some edge is blue (a blue $K_2$) or all are red (a red $K_s$); and $K_{s-1}$ all red has neither. Similarly $R(2, t) = t$.

      **The bound.** Assume $R(s-1,t)$ and $R(s,t-1)$ exist, and let $N = R(s-1,t) + R(s,t-1)$. Colour the edges of $K_N$ and pick a vertex $v$. It has $N - 1$ neighbours, split into red-neighbours and blue-neighbours. If there were fewer than $R(s-1,t)$ red-neighbours and fewer than $R(s,t-1)$ blue-neighbours, there would be at most $N - 2$ neighbours in total. So one of the following holds:

      - At least $R(s-1,t)$ red-neighbours. Among them there is a red $K_{s-1}$, and adding $v$ gives a red $K_s$; or there is a blue $K_t$.
      - At least $R(s,t-1)$ blue-neighbours. Among them there is a red $K_s$, or a blue $K_{t-1}$ which together with $v$ gives a blue $K_t$.

      **Existence** follows by induction on $s + t$ from the base values. In particular $R(3,3) \le R(2,3) + R(3,2) = 3 + 3 = 6$. $\blacksquare$

  - id: gt-029
    title: Hall's marriage theorem
    subtopic: Matchings & Ramsey
    difficulty: hard
    type: proof
    tags: [matchings, hall, induction]
    source: Hall, 1935
    related: [gt-030]
    hints:
      - |
        Induct on $|X|$. Split into cases according to whether some non-empty proper $S \subsetneq X$ has $|N(S)| = |S|$ exactly.
    statement: |
      Let $G$ be a bipartite graph with parts $X$ and $Y$. For $S \subseteq X$ let $N(S)$ be the set of neighbours of $S$. Prove that $G$ has a matching covering every vertex of $X$ if and only if $|N(S)| \ge |S|$ for every $S \subseteq X$.
    solution: |
      **($\Rightarrow$)** A matching sends the vertices of $S$ to $|S|$ distinct neighbours.

      **($\Leftarrow$)** Induct on $|X|$. If $|X| = 1$, its vertex has a neighbour. Assume Hall's condition and $|X| \ge 2$.

      **Case 1:** $|N(S)| \ge |S| + 1$ for every non-empty $S \subsetneq X$. Pick any $x \in X$ and a neighbour $y$, match them, and delete both. In the remaining graph, any non-empty $S \subseteq X \setminus \{x\}$ has lost at most one neighbour ($y$), so $|N'(S)| \ge |S|$. By induction the rest of $X$ can be matched.

      **Case 2:** some non-empty $S \subsetneq X$ has $|N(S)| = |S|$. The subgraph on $S \cup N(S)$ satisfies Hall's condition (neighbourhoods of subsets of $S$ lie in $N(S)$), so by induction $S$ can be matched into $N(S)$. Now consider $G'$ on $(X \setminus S) \cup (Y \setminus N(S))$. For $T \subseteq X \setminus S$,
      $$|N_{G'}(T)| = |N(T \cup S)| - |N(S)| \ge |T| + |S| - |S| = |T|.$$
      By induction $X \setminus S$ can be matched into $Y \setminus N(S)$. The two matchings use disjoint vertices, so together they cover $X$. $\blacksquare$

  - id: gt-030
    title: Regular bipartite graphs have perfect matchings
    subtopic: Matchings & Ramsey
    difficulty: medium
    type: proof
    tags: [matchings, hall, regular graphs]
    related: [gt-029]
    statement: |
      Let $G$ be a $k$-regular bipartite graph with $k \ge 1$. Prove that $G$ has a perfect matching.
    solution: |
      Let the parts be $X, Y$. Counting edges from each side gives $k|X| = |E| = k|Y|$, so $|X| = |Y|$.

      **Hall's condition.** Let $S \subseteq X$. Exactly $k|S|$ edges leave $S$, and all of them end in $N(S)$. Each vertex of $N(S)$ is the endpoint of exactly $k$ edges in total, so $k|S| \le k|N(S)|$, i.e. $|N(S)| \ge |S|$.

      By Hall's theorem there is a matching covering $X$. Since $|X| = |Y|$, it covers $Y$ as well: a perfect matching. $\blacksquare$

  - id: gt-031
    title: Degrees of familiar graphs
    subtopic: Degrees
    difficulty: easy
    type: compute
    tags: [degrees, handshake lemma, special graphs]
    related: [gt-001]
    statement: |
      Give the degrees and the number of edges of $K_n$, $K_{m,n}$, the cycle $C_n$, the hypercube $Q_n$, and the Petersen graph (10 vertices, 3-regular).
    solution: |
      - $K_n$: every degree $n - 1$; $\frac{n(n-1)}{2}$ edges.
      - $K_{m,n}$: degrees $n$ (on the $m$ side) and $m$; $mn$ edges.
      - $C_n$: every degree 2; $n$ edges.
      - $Q_n$: every degree $n$ (flip any of $n$ bits); $\frac{n2^n}{2} = n2^{n-1}$ edges.
      - Petersen: $\frac{10\cdot3}{2} = 15$ edges.

      In each case the edge count is half the degree sum.

  - id: gt-032
    title: The Havel–Hakimi test
    subtopic: Degrees
    difficulty: medium
    type: proof
    tags: [degree sequences, graphic sequences]
    source: Havel, Hakimi
    related: [gt-003, gt-038]
    statement: |
      Let $d_1 \ge d_2 \ge \cdots \ge d_n$. Prove that $(d_1, \dots, d_n)$ is the degree sequence of a simple graph iff $(d_2 - 1, \dots, d_{d_1+1} - 1, d_{d_1+2}, \dots, d_n)$ is. Use it to show $(3, 3, 2, 2, 1, 1)$ is graphic.
    solution: |
      **($\Leftarrow$)** Take a graph with the reduced sequence and add a vertex adjacent to the vertices of degrees $d_2 - 1, \dots, d_{d_1+1} - 1$.

      **($\Rightarrow$)** Among graphs with degrees $d_i$ at vertices $v_i$, take one where $v_1$ has as many neighbours as possible among $v_2, \dots, v_{d_1+1}$. If $v_1$ is not adjacent to some $v_i$ ($2 \le i \le d_1 + 1$), it is adjacent to some $v_j$ with $j > d_1 + 1$. As $d_i \ge d_j$ and $v_j$ has the neighbour $v_1$ that $v_i$ lacks, $v_i$ has a neighbour $w$ that $v_j$ lacks. Replace edges $v_1v_j, v_iw$ by $v_1v_i, v_jw$: degrees are unchanged and $v_1$ gains a neighbour in the first group, a contradiction. So $v_1$ is adjacent to exactly $v_2, \dots, v_{d_1+1}$, and deleting it gives the reduced sequence.

      **Example.** $(3,3,2,2,1,1) \to (2,1,1,1,1) \to (0,0,1,1) = (1,1,0,0) \to (0,0,0)$, which is graphic (three isolated vertices). $\blacksquare$

  - id: gt-033
    title: High minimum degree forces connectivity
    subtopic: Degrees
    difficulty: medium
    type: proof
    tags: [degrees, connectivity]
    related: [gt-005]
    statement: |
      Prove that a simple graph on $n$ vertices in which every vertex has degree at least $\frac{n-1}{2}$ is connected. Show the bound can't be lowered.
    solution: |
      Take non-adjacent $u, v$. They have at least $\frac{n-1}{2}$ neighbours each, all among the other $n - 2$ vertices. Since $\frac{n-1}{2} + \frac{n-1}2 = n - 1 > n - 2$, they share a neighbour. So any two vertices are at distance at most 2.

      **Sharp.** For even $n$, two disjoint copies of $K_{n/2}$ have minimum degree $\frac n2 - 1 < \frac{n-1}{2}$ and are disconnected. $\blacksquare$

  - id: gt-034
    title: Dense subgraphs
    subtopic: Degrees
    difficulty: hard
    type: proof
    tags: [degrees, average degree, subgraphs]
    statement: |
      Prove that every graph with average degree $d > 0$ has a subgraph with minimum degree greater than $\frac d2$.
    solution: |
      Let $n, e$ be the numbers of vertices and edges, so $e = \frac{dn}{2}$, and consider $\Phi = e - \frac d2n$, initially $0$. Repeatedly delete a vertex of degree at most $\frac d2$ (in the current graph). Each deletion removes one vertex and at most $\frac d2$ edges, so $\Phi$ never decreases.

      If every vertex were eventually deleted, then just before the last deletion the graph would be a single vertex with no edges, where $\Phi = -\frac d2 < 0$, a contradiction. So the process stops at a non-empty subgraph in which every vertex has degree greater than $\frac d2$. $\blacksquare$

  - id: gt-035
    title: Regular graphs
    subtopic: Degrees
    difficulty: easy
    type: proof
    tags: [regular graphs, handshake lemma]
    statement: |
      Prove that a $k$-regular graph on $n$ vertices has $\frac{nk}{2}$ edges, so $nk$ is even. For which $n$ is there a 3-regular graph on $n$ vertices?
    solution: |
      Handshake lemma: $2e = nk$.

      3-regular needs $n$ even, and $n \ge 4$. Conversely every even $n \ge 4$ works: take the cycle $C_n$ and join each vertex to the opposite one ($i \sim i + \frac n2$). $\blacksquare$

  - id: gt-036
    title: Enough edges force a cycle
    subtopic: Degrees
    difficulty: medium
    type: proof
    tags: [cycles, forests, edges]
    related: [gt-044]
    statement: |
      Prove that a graph with $n$ vertices and at least $n$ edges contains a cycle.
    solution: |
      If not, it is a forest; with $c \ge 1$ components it has $n - c \le n - 1$ edges (gt-044). Contradiction. $\blacksquare$

  - id: gt-037
    title: Mantel's theorem
    subtopic: Degrees
    difficulty: hard
    type: proof
    tags: [extremal graph theory, triangles, cauchy-schwarz]
    source: Mantel, 1907
    hints:
      - |
        For an edge $uv$ in a triangle-free graph, $\deg u + \deg v \le n$. Sum over edges.
    statement: |
      Prove that a triangle-free graph on $n$ vertices has at most $\frac{n^2}{4}$ edges, and that this is attained.
    solution: |
      For an edge $uv$, the neighbourhoods of $u$ and $v$ are disjoint (a common neighbour would make a triangle), so $\deg u + \deg v \le n$. Summing over the $e$ edges,
      $$\sum_{uv\in E}(\deg u + \deg v) = \sum_v\deg(v)^2 \le ne,$$
      since each vertex $v$ appears in $\deg v$ edges. By Cauchy–Schwarz, $\sum\deg(v)^2 \ge \frac{(\sum\deg v)^2}{n} = \frac{4e^2}{n}$. So $\frac{4e^2}{n} \le ne$, i.e. $e \le \frac{n^2}{4}$.

      **Attained:** $K_{\lfloor n/2\rfloor, \lceil n/2\rceil}$ is triangle-free (bipartite) with $\lfloor\frac{n^2}{4}\rfloor$ edges. $\blacksquare$

  - id: gt-038
    title: A sequence that isn't graphic
    subtopic: Degrees
    difficulty: easy
    type: compute
    tags: [degree sequences, havel-hakimi]
    related: [gt-032]
    statement: |
      Is $(5, 5, 4, 3, 2, 1)$ the degree sequence of a simple graph? Is $(4, 4, 3, 3, 2, 2)$?
    solution: |
      **First.** The sum is 20 (even), but Havel–Hakimi gives $(4, 3, 2, 1, 0) \to (2, 1, 0, -1)$, negative. **Not graphic.** (Directly: two vertices of degree 5 are adjacent to all others, so the degree-1 vertex would have degree 2.)

      **Second.** $(4,4,3,3,2,2) \to (3,2,2,1,2) = (3,2,2,2,1) \to (1,1,1,1) \to (0,1,1) = (1,1,0) \to (0,0)$. **Graphic.**

  - id: gt-039
    title: Same degrees, different graphs
    subtopic: Degrees
    difficulty: easy
    type: proof
    tags: [isomorphism, degree sequences]
    statement: |
      Show that the 6-cycle $C_6$ and two disjoint triangles have the same degree sequence but are not isomorphic.
    solution: |
      Both are 2-regular on 6 vertices. But $C_6$ is connected and the two triangles are not; isomorphisms preserve connectedness. (Also $C_6$ has no triangle.) $\blacksquare$

  - id: gt-040
    title: Self-complementary graphs
    subtopic: Degrees
    difficulty: medium
    type: proof
    tags: [complement, isomorphism, edges]
    related: [gt-016]
    statement: |
      A graph is self-complementary if it is isomorphic to its complement. Prove that then $n \equiv 0$ or $1 \pmod 4$, and give examples with 4 and 5 vertices.
    solution: |
      $G$ and $\overline G$ have the same number of edges, which together make $\binom n2$. So $\binom n2 = \frac{n(n-1)}{2}$ is even, i.e. $4 \mid n(n-1)$, which (as $n$ and $n - 1$ are coprime) means $4 \mid n$ or $4 \mid n - 1$.

      **Examples.** The path $P_4$ ($a-b-c-d$): its complement is the path $b-d-a-c$. The 5-cycle: its complement is the 5-cycle of "distance 2" chords. $\blacksquare$

  - id: gt-041
    title: Edges of the line graph
    subtopic: Degrees
    difficulty: medium
    type: proof
    tags: [line graphs, degrees, counting]
    statement: |
      The line graph $L(G)$ has the edges of $G$ as vertices, two adjacent when they share an endpoint. Prove that $L(G)$ has $\sum_v\binom{\deg v}{2}$ edges (for a simple graph $G$). Compute it for $K_4$.
    solution: |
      Two edges of a simple graph share at most one endpoint. So edges of $L(G)$ correspond to pairs of edges at a common vertex $v$, and at $v$ there are $\binom{\deg v}{2}$ such pairs.

      $K_4$: $4\binom32 = 12$. ($L(K_4)$ is the octahedron.) $\blacksquare$

  - id: gt-042
    title: Sum of squared degrees
    subtopic: Degrees
    difficulty: medium
    type: proof
    tags: [degrees, double counting]
    related: [gt-037]
    statement: |
      Prove that $\sum_v\deg(v)^2 = \sum_{uv \in E}(\deg u + \deg v)$.
    solution: |
      In the right-hand sum, each vertex $v$ contributes $\deg v$ once for each edge at $v$, i.e. $\deg v$ times. So the total is $\sum_v\deg v\cdot\deg v$. $\blacksquare$

  - id: gt-043
    title: Acyclic with n − 1 edges means tree
    subtopic: Trees
    difficulty: medium
    type: proof
    tags: [trees, forests, characterisations]
    related: [gt-009, gt-044]
    statement: |
      Prove that an acyclic graph with $n$ vertices and $n - 1$ edges is connected (hence a tree).
    solution: |
      An acyclic graph is a forest. If it has $c$ components, each a tree, it has $n - c$ edges (gt-044). So $n - c = n - 1$, i.e. $c = 1$. $\blacksquare$

  - id: gt-044
    title: Edges in a forest
    subtopic: Trees
    difficulty: easy
    type: proof
    tags: [forests, trees, edges]
    related: [gt-007]
    statement: |
      Prove that a forest with $n$ vertices and $c$ components has $n - c$ edges.
    solution: |
      Each component is a tree; if it has $n_i$ vertices it has $n_i - 1$ edges (gt-007). Summing, $\sum(n_i - 1) = n - c$. $\blacksquare$

  - id: gt-045
    title: Trees are minimally connected and maximally acyclic
    subtopic: Trees
    difficulty: easy
    type: proof
    tags: [trees, bridges, cycles]
    related: [gt-010]
    statement: |
      Let $T$ be a tree. Prove that deleting any edge disconnects $T$, and adding any new edge creates exactly one cycle.
    solution: |
      **Deleting $uv$.** The edge $uv$ is the unique $u$–$v$ path (gt-010), so after deletion there is none.

      **Adding $uv$.** The unique $u$–$v$ path $P$ together with $uv$ is a cycle. Any cycle in $T + uv$ must use $uv$ ($T$ has none), and removing $uv$ from it leaves a $u$–$v$ path in $T$, which must be $P$. So the cycle is unique. $\blacksquare$

  - id: gt-046
    title: Trees are bipartite
    subtopic: Trees
    difficulty: easy
    type: proof
    tags: [trees, bipartite]
    related: [gt-015]
    statement: |
      Prove that every tree is bipartite, and that its bipartition is unique.
    solution: |
      A tree has no cycles, in particular no odd cycles, so it is bipartite (gt-015). Concretely, colour vertices by the parity of their distance from a fixed root.

      **Unique.** In any 2-colouring, adjacent vertices differ, so along the unique path from the root, colours alternate: each vertex's colour is forced by its distance's parity. $\blacksquare$

  - id: gt-047
    title: The centre of a tree
    subtopic: Trees
    difficulty: hard
    type: proof
    tags: [trees, eccentricity, centre]
    source: Jordan, 1869
    hints:
      - |
        Removing all leaves lowers every remaining vertex's eccentricity by exactly 1.
    statement: |
      The eccentricity of a vertex is its greatest distance to another vertex, and the centre is the set of vertices of minimum eccentricity. Prove that the centre of a tree is a single vertex or two adjacent vertices.
    solution: |
      Induct on $n$; trees with 1 or 2 vertices are clear. Let $n \ge 3$ and let $T'$ be $T$ with all leaves removed, a non-empty tree.

      **A farthest vertex is a leaf.** If $w$ is farthest from $v$ and had a neighbour off the $v$–$w$ path, that neighbour would be farther.

      **Eccentricities drop by 1.** For $v \in T'$, the vertices at maximum distance from $v$ are leaves, so in $T'$ all distances from $v$ are at most $\mathrm{ecc}_T(v) - 1$. And the neighbour of a farthest leaf on the path from $v$ is not a leaf, lies in $T'$, and is at distance $\mathrm{ecc}_T(v) - 1$. So $\mathrm{ecc}_{T'}(v) = \mathrm{ecc}_T(v) - 1$.

      **Leaves are not central.** A leaf $\ell$ with neighbour $u$ has $d(\ell, x) = d(u, x) + 1$ for all $x \ne \ell$, and (as $n \ge 3$) the maximum of $d(u, x)$ over $x \ne \ell$ is $\mathrm{ecc}(u)$. So $\mathrm{ecc}(\ell) = \mathrm{ecc}(u) + 1$.

      Hence the centre of $T$ is the set of vertices of $T'$ minimising $\mathrm{ecc}_T$, which is the centre of $T'$; by induction it is a vertex or two adjacent vertices. $\blacksquare$

  - id: gt-048
    title: Prüfer codes and Cayley's formula
    subtopic: Trees
    difficulty: hard
    type: proof
    tags: [trees, prufer code, cayley formula, bijection]
    source: Prüfer, 1918
    related: [gt-012]
    statement: |
      For a tree on $\{1, \dots, n\}$ ($n \ge 2$), repeatedly delete the smallest leaf and record its neighbour, until two vertices remain. This gives a sequence of length $n - 2$. Prove that this is a bijection between labelled trees and $\{1, \dots, n\}^{n-2}$, so there are $n^{n-2}$ trees. Find the code of the tree with edges $14, 24, 34, 45, 56$.
    solution: |
      **Degrees.** Each vertex $v$ appears in the code exactly $\deg v - 1$ times: it is recorded once each time a neighbour is deleted, and every neighbour except possibly one (the last) is deleted before $v$ either is deleted or survives to the end. So the vertices **not** in the code are exactly the leaves.

      **Inverse.** Given a code $a_1, \dots, a_{n-2}$, the first deleted leaf must be the smallest vertex not appearing in the code, and its neighbour is $a_1$. Remove that vertex and $a_1$ from consideration appropriately and repeat on $a_2, \dots$ with the remaining vertices; at the end join the last two. This reconstructs the tree uniquely, and running it on any sequence produces a tree whose code is that sequence. So the map is a bijection and there are $n^{n-2}$ labelled trees.

      **Example.** Leaves 1, 2, 3, 6. Delete 1 (record 4), 2 (record 4), 3 (record 4); now 4 is a leaf adjacent to 5, delete 4 (record 5). Code: $(4, 4, 4, 5)$. $\blacksquare$

  - id: gt-049
    title: Spanning trees of K₂,ₙ
    subtopic: Trees
    difficulty: medium
    type: compute
    tags: [spanning trees, counting, complete bipartite]
    statement: |
      Count the spanning trees of $K_{2,n}$.
    solution: |
      Let the small side be $\{a, b\}$ and the large side $Y$. A spanning tree has $n + 2$ vertices and $n + 1$ edges, and each $y \in Y$ must be joined to $a$, $b$, or both. That gives at least $n$ edges, and exactly one extra: so exactly one $y$ is joined to both (otherwise $a$ and $b$ would not be connected, or there would be too many edges).

      Choose that $y$ ($n$ ways) and, for each other $y$, whether it hangs off $a$ or $b$ ($2^{n-1}$ ways). Each choice is connected with $n + 1$ edges, hence a tree. Total $n2^{n-1}$.

  - id: gt-050
    title: Spanning trees of a cycle
    subtopic: Trees
    difficulty: easy
    type: compute
    tags: [spanning trees, cycles]
    statement: |
      How many spanning trees does $C_n$ have? How many does $C_n$ with one chord (splitting it into cycles of lengths $a$ and $b$) have?
    solution: |
      A spanning tree of $C_n$ has $n - 1$ edges, so it omits exactly one edge, and omitting any one edge leaves a path. So $n$.

      **With a chord.** Now there are $n + 1$ edges and three cycles: $C_a$, $C_b$ (sharing the chord) and the outer $n$-cycle. A spanning tree omits two edges that together break all three cycles. Either the chord and any one of the $n$ outer edges, or one non-chord edge of $C_a$ and one of $C_b$: $(a - 1)(b - 1)$ ways. (Two edges from the same side leave the other small cycle intact.) Total $n + (a - 1)(b - 1)$.

      E.g. a square with a diagonal ($n = 4$, $a = b = 3$): $4 + 4 = 8$.

  - id: gt-051
    title: Kruskal's algorithm
    subtopic: Trees
    difficulty: hard
    type: proof
    tags: [minimum spanning trees, greedy algorithms, exchange argument]
    source: Kruskal, 1956
    statement: |
      In a connected graph with distinct edge weights, Kruskal's algorithm considers edges in increasing order of weight and keeps each one that doesn't form a cycle with those already kept. Prove that the result is a minimum-weight spanning tree.
    solution: |
      **It is a spanning tree.** The kept edges form a forest. If it had two components, the lightest edge of $G$ joining them would have been kept when considered (it couldn't form a cycle), a contradiction.

      **Cut property.** If $S$ is a set of vertices, the lightest edge $e$ leaving $S$ lies in every minimum spanning tree $M$: otherwise $M + e$ has a cycle crossing the cut twice, so it contains another edge $f$ leaving $S$, heavier than $e$, and $M + e - f$ is a lighter spanning tree.

      **Each kept edge is in the minimum tree.** When Kruskal keeps $e = uv$, let $S$ be the component of $u$ in the current forest. $v \notin S$, and every lighter edge leaving $S$ would already have been kept (it formed no cycle), so $e$ is the lightest edge leaving $S$. By the cut property it lies in the minimum spanning tree. So Kruskal's tree is contained in it, and having the same number of edges, equals it. $\blacksquare$

  - id: gt-052
    title: Many leaves for high degree
    subtopic: Trees
    difficulty: medium
    type: proof
    tags: [trees, leaves, degrees]
    related: [gt-008]
    statement: |
      Prove that a tree with a vertex of degree $\Delta$ has at least $\Delta$ leaves.
    solution: |
      Let $v$ have neighbours $u_1, \dots, u_\Delta$. Deleting $v$ splits the tree into $\Delta$ components, one containing each $u_i$. In each component, follow a longest path starting at $u_i$ away from $v$; it ends at a vertex with no further neighbours, a leaf of the original tree (if the component is just $u_i$, then $u_i$ is itself a leaf). These $\Delta$ leaves lie in different components, so they are distinct. $\blacksquare$

  - id: gt-053
    title: Cut vertices
    subtopic: Connectivity
    difficulty: medium
    type: proof
    tags: [cut vertices, paths]
    statement: |
      In a connected graph, $v$ is a cut vertex if $G - v$ is disconnected. Prove that $v$ is a cut vertex iff there are vertices $u, w \ne v$ such that every $u$–$w$ path passes through $v$.
    solution: |
      **($\Rightarrow$)** Pick $u, w$ in different components of $G - v$. A $u$–$w$ path avoiding $v$ would lie in $G - v$, impossible.

      **($\Leftarrow$)** If every $u$–$w$ path uses $v$, then $G - v$ has no $u$–$w$ path, so it is disconnected. $\blacksquare$

  - id: gt-054
    title: A vertex you can always remove
    subtopic: Connectivity
    difficulty: easy
    type: proof
    tags: [connectivity, spanning trees, leaves]
    related: [gt-013, gt-008]
    statement: |
      Prove that every connected graph with at least 2 vertices has at least two vertices that are not cut vertices.
    solution: |
      Take a spanning tree $T$ (gt-013); it has at least two leaves (gt-008). Removing a leaf $\ell$ from $T$ leaves a tree on the other vertices, which is a connected spanning subgraph of $G - \ell$. So $G - \ell$ is connected. $\blacksquare$

  - id: gt-055
    title: Bridges are the edges on no cycle
    subtopic: Connectivity
    difficulty: medium
    type: proof
    tags: [bridges, cycles]
    related: [gt-045]
    statement: |
      An edge $e$ of a connected graph is a bridge if $G - e$ is disconnected. Prove that $e$ is a bridge iff it lies on no cycle.
    solution: |
      Let $e = uv$.

      **On a cycle ⇒ not a bridge.** The rest of the cycle is a $u$–$v$ path avoiding $e$, so any walk using $e$ can be rerouted.

      **Not a bridge ⇒ on a cycle.** If $G - e$ is connected, it has a $u$–$v$ path, which with $e$ forms a cycle. $\blacksquare$

  - id: gt-056
    title: Graph distance is a metric
    subtopic: Connectivity
    difficulty: easy
    type: proof
    tags: [distance, metric]
    statement: |
      In a connected graph let $d(u, v)$ be the length of a shortest $u$–$v$ path. Prove that $d$ is a metric.
    solution: |
      $d(u, v) \ge 0$ with equality iff $u = v$ (a path of length 0 is a single vertex). $d(u,v) = d(v,u)$ by reversing paths. Triangle inequality: concatenating a shortest $u$–$v$ path and a shortest $v$–$w$ path gives a $u$–$w$ walk of length $d(u,v) + d(v,w)$, which contains a $u$–$w$ path no longer (gt-014). $\blacksquare$

  - id: gt-057
    title: Large diameter makes the complement small
    subtopic: Connectivity
    difficulty: medium
    type: proof
    tags: [diameter, complement]
    related: [gt-016]
    statement: |
      Prove that if a graph $G$ has diameter at least 3, then $\overline G$ has diameter at most 3.
    solution: |
      Pick $a, b$ with $d_G(a, b) \ge 3$. They are not adjacent in $G$ and have no common neighbour in $G$. So $ab$ is an edge of $\overline G$, and every other vertex is non-adjacent in $G$ to at least one of $a, b$, i.e. adjacent to it in $\overline G$.

      For each vertex $x$ let $\alpha(x) \in \{a, b\}$ be $x$ itself if $x \in \{a, b\}$, and otherwise one of $a, b$ adjacent to $x$ in $\overline G$. For any $u, v$, the walk $u,\ \alpha(u),\ \alpha(v),\ v$ in $\overline G$ (where $\alpha(u)\alpha(v)$ is either a single vertex or the edge $ab$) has length at most 3. So $\overline G$ has diameter at most 3. $\blacksquare$

  - id: gt-058
    title: Two longest paths meet
    subtopic: Connectivity
    difficulty: medium
    type: proof
    tags: [paths, connectivity, longest path]
    statement: |
      Prove that in a connected graph any two longest paths share a vertex.
    solution: |
      Let $P$ and $Q$ be longest paths, of length $L$, and suppose they are disjoint. By connectivity there is a path $R$ from a vertex $p$ of $P$ to a vertex $q$ of $Q$ meeting $P$ and $Q$ only at its ends. $p$ splits $P$ into two pieces, one of length at least $\frac L2$; likewise $q$ splits $Q$. Joining the long piece of $P$, then $R$ (length $\ge 1$), then the long piece of $Q$ gives a path of length at least $\frac L2 + 1 + \frac L2 > L$. Contradiction. $\blacksquare$

  - id: gt-059
    title: Few edges mean many components
    subtopic: Connectivity
    difficulty: easy
    type: proof
    tags: [components, edges]
    related: [gt-044]
    statement: |
      Prove that a graph with $n$ vertices and $m$ edges has at least $n - m$ connected components.
    solution: |
      Start with $n$ isolated vertices ($n$ components) and add the edges one at a time. Each edge either joins two components (reducing the count by 1) or lies within one (no change). So at the end there are at least $n - m$. $\blacksquare$

  - id: gt-060
    title: Long paths and cycles from minimum degree
    subtopic: Connectivity
    difficulty: medium
    type: proof
    tags: [paths, cycles, minimum degree]
    statement: |
      Let $G$ have minimum degree $\delta \ge 2$. Prove that $G$ contains a path of length at least $\delta$ and a cycle of length at least $\delta + 1$.
    solution: |
      Let $P = v_0v_1\cdots v_k$ be a longest path. All neighbours of $v_0$ lie on $P$ (otherwise $P$ could be extended). $v_0$ has at least $\delta$ neighbours among $v_1, \dots, v_k$, so $k \ge \delta$.

      Let $v_j$ be the neighbour of $v_0$ with largest index; $j \ge \delta$. Then $v_0v_1\cdots v_jv_0$ is a cycle of length $j + 1 \ge \delta + 1$. $\blacksquare$

  - id: gt-061
    title: Two vertices on a common cycle
    subtopic: Connectivity
    difficulty: hard
    type: proof
    tags: [2-connected, cycles, whitney]
    source: Whitney, 1932
    statement: |
      A graph with at least 3 vertices is 2-connected if it is connected and has no cut vertex. Prove that if every two vertices lie on a common cycle, the graph is 2-connected; and conversely, that in a 2-connected graph any two **adjacent** vertices lie on a common cycle.
    solution: |
      **Cycles ⇒ 2-connected.** Connected: any two vertices lie on a cycle, which contains paths between them. No cut vertex: given $v$ and $u, w \ne v$, a cycle through $u$ and $w$ gives two $u$–$w$ paths sharing only their ends, so at least one avoids $v$; hence $G - v$ is connected.

      **Adjacent vertices.** Let $uv$ be an edge. If $G - uv$ had no $u$–$v$ path, then $uv$ would be a bridge. With at least 3 vertices, one endpoint, say $u$, has another neighbour $w$ (by connectivity). Removing $uv$ separates $u$'s side from $v$'s, and then $u$ is a cut vertex separating $w$ from $v$ (every $w$–$v$ path must use $uv$, hence pass through $u$). Contradiction. So $G - uv$ has a $u$–$v$ path, which with $uv$ forms a cycle. $\blacksquare$

      (Whitney's theorem extends this to non-adjacent vertices too.)

  - id: gt-062
    title: Every tournament has a king
    subtopic: Connectivity
    difficulty: medium
    type: proof
    tags: [tournaments, directed graphs]
    related: [in-133]
    statement: |
      In a tournament, a **king** is a player $k$ such that every other player is beaten by $k$ or by someone $k$ beats. Prove that a player with the most wins is a king.
    solution: |
      Let $k$ have the most wins, and suppose some $x$ is neither beaten by $k$ nor by anyone $k$ beats. Then $x$ beats $k$ and beats everyone $k$ beats. So $x$ has at least one more win than $k$, a contradiction. $\blacksquare$

  - id: gt-063
    title: Orienting a graph to be strongly connected
    subtopic: Connectivity
    difficulty: medium
    type: proof
    tags: [orientations, bridges, strongly connected]
    source: Robbins, 1939
    related: [gt-055]
    statement: |
      Prove that if a connected graph has a bridge then no orientation of its edges is strongly connected (every vertex reachable from every other along directed edges). Show that every cycle can be oriented to be strongly connected.
    solution: |
      **Bridge.** Let $uv$ be a bridge, oriented $u \to v$ say. Every path from $v$'s side to $u$'s side must use $uv$, but it only goes from $u$ to $v$. So nothing on $v$'s side reaches $u$.

      **Cycle.** Orient it cyclically, $v_1 \to v_2 \to \cdots \to v_n \to v_1$. From $v_i$ you reach every vertex by going round. $\blacksquare$

      (Robbins' theorem: a connected graph has a strongly connected orientation iff it is bridgeless.)

  - id: gt-064
    title: The bridges of Königsberg
    subtopic: Euler & Hamilton
    difficulty: easy
    type: compute
    tags: [euler trails, multigraphs]
    source: Euler, 1736
    related: [gt-018]
    statement: |
      Königsberg had four land masses joined by seven bridges: the island $A$ joined to the north bank $B$ by two bridges, to the south bank $C$ by two, and to the east land $D$ by one; and $D$ joined to $B$ and to $C$ by one each. Can one walk crossing every bridge exactly once?
    solution: |
      Degrees: $A$: $5$; $B$: $3$; $C$: $3$; $D$: $3$. All four are odd. An Euler trail needs 0 or 2 odd vertices (the theorem holds for multigraphs), so **no**.

  - id: gt-065
    title: Euler trails
    subtopic: Euler & Hamilton
    difficulty: medium
    type: proof
    tags: [euler trails, euler circuits]
    related: [gt-017]
    statement: |
      Prove that a connected graph has an Euler trail from $u$ to $v \ne u$ if and only if $u$ and $v$ are the only vertices of odd degree.
    solution: |
      **($\Rightarrow$)** Passing through a vertex uses edges in pairs; only the start and end use one unpaired edge each.

      **($\Leftarrow$)** Add a new edge $e = uv$ (allowing a multigraph). Now every degree is even and the graph is connected, so it has an Euler circuit (gt-017, which works for multigraphs). Start the circuit with $e$ traversed from $v$ to $u$; deleting $e$ leaves an Euler trail from $u$ to $v$. $\blacksquare$

  - id: gt-066
    title: Euler circuits in directed graphs
    subtopic: Euler & Hamilton
    difficulty: medium
    type: proof
    tags: [euler circuits, directed graphs]
    related: [gt-017, gt-071]
    statement: |
      Prove that if a directed graph has an Euler circuit (using every arc once, in its direction) then every vertex has in-degree equal to out-degree, and that a connected directed graph with this property has an Euler circuit.
    solution: |
      **Necessity.** Each visit to a vertex enters along one arc and leaves along another.

      **Sufficiency.** As in gt-017: starting anywhere and following unused arcs, we can only get stuck at the start vertex (every other vertex has as many unused exits as entrances when we arrive), so we obtain a closed trail. Remove it; in/out balance is preserved; by induction each remaining connected piece has an Euler circuit, and we splice them in where the first trail meets them. $\blacksquare$

  - id: gt-067
    title: Dirac's theorem
    subtopic: Euler & Hamilton
    difficulty: hard
    type: proof
    tags: [hamiltonian cycles, minimum degree, longest path]
    source: Dirac, 1952
    hints:
      - |
        Take a longest path $v_0\cdots v_k$ and find an index $i$ with $v_0 \sim v_{i+1}$ and $v_k \sim v_i$.
    statement: |
      Prove that a simple graph on $n \ge 3$ vertices with minimum degree at least $\frac n2$ has a Hamiltonian cycle.
    solution: |
      $G$ is connected (gt-033). Let $P = v_0\cdots v_k$ be a longest path. All neighbours of $v_0$ and of $v_k$ lie on $P$.

      **A cycle on $P$'s vertices.** Let $A = \{i : v_0 \sim v_{i+1}\}$ and $B = \{i : v_k \sim v_i\}$, both subsets of $\{0, \dots, k-1\}$, with $|A|, |B| \ge \frac n2$. Since $k \le n - 1$, $|A| + |B| \ge n > k$, so some $i \in A\cap B$. Then $v_0v_1\cdots v_iv_kv_{k-1}\cdots v_{i+1}v_0$ is a cycle $C$ through all of $P$'s vertices.

      **It covers everything.** If some vertex $w$ is not on $C$, connectivity gives an edge from $w$ (or a path) to some vertex of $C$; opening $C$ there gives a path longer than $P$. So $C$ is Hamiltonian. $\blacksquare$

  - id: gt-068
    title: Hamiltonian grids
    subtopic: Euler & Hamilton
    difficulty: medium
    type: proof
    tags: [hamiltonian cycles, grids, bipartite]
    related: [gt-020]
    statement: |
      The $m\times n$ grid graph ($m, n \ge 2$) has the cells of an $m\times n$ board as vertices, adjacent when they share a side. Prove it has a Hamiltonian cycle iff $mn$ is even.
    solution: |
      **Odd $mn$ fails.** The grid is bipartite (chessboard colouring) with parts of sizes $\frac{mn+1}{2}$ and $\frac{mn-1}2$. A cycle alternates colours, so it uses equally many of each and can't cover all vertices.

      **Even $mn$.** Say $m$ (the number of rows) is even. Go along the top row from left to right, then snake back and forth through rows $2, \dots, m$ using columns $2, \dots, n$ only, ending in row $m$ at column 2; finally return up column 1 from row $m$ to row 1. Since $m$ is even, the snake through rows $2..m$ starts heading left in row 2 and ends heading left in row $m$, arriving at column 2, next to column 1. $\blacksquare$

  - id: gt-069
    title: No closed knight's tour on a 5×5 board
    subtopic: Euler & Hamilton
    difficulty: easy
    type: proof
    tags: [hamiltonian cycles, knight's tour, bipartite]
    statement: |
      Prove that there is no closed knight's tour of a $5\times5$ board (a sequence of knight moves visiting every square once and returning to the start).
    solution: |
      A knight always moves between squares of opposite colours, so the knight's graph is bipartite. A closed tour is a Hamiltonian cycle, which in a bipartite graph needs equally many squares of each colour. A $5\times5$ board has 13 of one colour and 12 of the other. $\blacksquare$

  - id: gt-070
    title: A necessary condition for Hamiltonicity
    subtopic: Euler & Hamilton
    difficulty: medium
    type: proof
    tags: [hamiltonian cycles, components]
    related: [gt-020]
    statement: |
      Prove that if $G$ has a Hamiltonian cycle then for every non-empty set $S$ of vertices, $G - S$ has at most $|S|$ components. Use this to show $K_{2,3}$ is not Hamiltonian.
    solution: |
      Removing $|S|$ vertices from a cycle leaves at most $|S|$ arcs (paths). The cycle is a spanning subgraph, so each component of $G - S$ contains at least one of these arcs. Hence at most $|S|$ components.

      In $K_{2,3}$, removing the two vertices of the small side leaves 3 isolated vertices: $3 > 2$ components. $\blacksquare$

  - id: gt-071
    title: De Bruijn sequences
    subtopic: Euler & Hamilton
    difficulty: hard
    type: proof
    tags: [de bruijn sequences, euler circuits, directed graphs]
    source: de Bruijn, 1946
    related: [gt-066]
    statement: |
      Prove that for every $n \ge 1$ there is a cyclic binary sequence of length $2^n$ in which every binary string of length $n$ appears exactly once as a block of consecutive digits. Give one for $n = 3$.
    solution: |
      Build the directed graph whose vertices are the $2^{n-1}$ strings of length $n - 1$, with an arc $a_1\cdots a_{n-1} \to a_2\cdots a_n$ for each string $a_1\cdots a_n$ of length $n$. Every vertex has out-degree 2 (append 0 or 1) and in-degree 2 (prepend 0 or 1), and the graph is strongly connected (you can reach any string by shifting in its digits). So it has an Euler circuit (gt-066), using each of the $2^n$ arcs once.

      Reading off the last digit of each arc along the circuit gives a cyclic sequence of length $2^n$ whose length-$n$ windows are exactly the arcs, each once.

      **$n = 3$:** $00010111$: the windows (cyclically) are $000, 001, 010, 101, 011, 111, 110, 100$. $\blacksquare$

  - id: gt-072
    title: The Chinese postman on K₄
    subtopic: Euler & Hamilton
    difficulty: medium
    type: compute
    tags: [euler circuits, route inspection]
    related: [gt-018]
    statement: |
      A postman must walk every edge of $K_4$ (each of length 1) at least once and return to the start. What is the shortest possible walk?
    solution: |
      $K_4$ has 6 edges and all 4 vertices have odd degree. A closed walk covering every edge corresponds to an Euler circuit of the multigraph obtained by duplicating the repeated edges, which must make every degree even. Each duplicated edge fixes the parity at 2 vertices, so at least 2 edges must be repeated: length $\ge 8$.

      Duplicating a perfect matching (2 disjoint edges) makes all degrees 4, so an Euler circuit of length $6 + 2 = 8$ exists. **Answer: 8.**

  - id: gt-073
    title: Even graphs decompose into cycles
    subtopic: Euler & Hamilton
    difficulty: medium
    type: proof
    tags: [cycle decomposition, even degrees]
    source: Veblen
    related: [gt-017]
    statement: |
      Prove that the edges of a graph can be partitioned into cycles if and only if every vertex has even degree.
    solution: |
      **($\Rightarrow$)** Each cycle through a vertex contributes 2 to its degree.

      **($\Leftarrow$)** Induct on the number of edges. If there are none, use no cycles. Otherwise the non-isolated vertices have degree $\ge 2$, so there is a cycle (take a longest path; its end has another neighbour on the path). Removing its edges keeps all degrees even, and by induction the rest decomposes. $\blacksquare$

  - id: gt-074
    title: Counting Hamiltonian cycles in Kₙ
    subtopic: Euler & Hamilton
    difficulty: easy
    type: compute
    tags: [hamiltonian cycles, counting]
    statement: |
      How many Hamiltonian cycles does $K_n$ ($n \ge 3$) have?
    solution: |
      A Hamiltonian cycle is a cyclic ordering of the vertices up to rotation and reversal. Fix the start vertex (removing rotations): $(n-1)!$ orders of the rest; each cycle arises twice (two directions). So $\frac{(n-1)!}{2}$; e.g. $K_4$ has 3 and $K_5$ has 12.

  - id: gt-075
    title: Decomposing K₅ into Hamiltonian cycles
    subtopic: Euler & Hamilton
    difficulty: medium
    type: compute
    tags: [hamiltonian decomposition, complete graphs]
    source: Walecki
    statement: |
      Show that the edges of $K_5$ split into two Hamiltonian cycles. Why can $K_n$ with $n$ even never split into Hamiltonian cycles?
    solution: |
      On $\{1,2,3,4,5\}$: the cycle $1\,2\,3\,4\,5\,1$ uses edges with "difference" $\pm1 \bmod 5$, and $1\,3\,5\,2\,4\,1$ uses those with difference $\pm2$. Together they use all 10 edges once.

      For even $n$, every vertex has odd degree $n - 1$, but each Hamiltonian cycle uses 2 edges at each vertex. So the degree would have to be even. $\blacksquare$

  - id: gt-076
    title: Independence number bounds the chromatic number
    subtopic: Colouring & planarity
    difficulty: easy
    type: proof
    tags: [chromatic number, independent sets]
    statement: |
      Let $\alpha(G)$ be the size of a largest independent set. Prove that $\chi(G) \ge \frac{n}{\alpha(G)}$, and use it to show $\chi(C_5) \ge 3$.
    solution: |
      Each colour class is an independent set, so has at most $\alpha$ vertices. With $\chi$ classes covering $n$ vertices, $\chi\alpha \ge n$.

      $C_5$ has $\alpha = 2$, so $\chi \ge \frac52$, hence $\chi \ge 3$. $\blacksquare$

  - id: gt-077
    title: Nordhaus–Gaddum upper bound
    subtopic: Colouring & planarity
    difficulty: hard
    type: proof
    tags: [chromatic number, complement, induction]
    source: Nordhaus, Gaddum, 1956
    related: [gt-078]
    statement: |
      Prove that $\chi(G) + \chi(\overline G) \le n + 1$ for every graph $G$ on $n$ vertices.
    solution: |
      Induct on $n$; $n = 1$ gives $1 + 1 = 2$. Remove a vertex $v$; by hypothesis $\chi(G - v) + \chi(\overline G - v) \le n$. Adding $v$ back increases each chromatic number by at most 1.

      If not both increase, $\chi(G) + \chi(\overline G) \le n + 1$. If both increase, then $v$ must see all colours in an optimal colouring of $G - v$, so $\deg_G v \ge \chi(G - v)$; likewise $\deg_{\overline G}v \ge \chi(\overline G - v)$. Adding, $n - 1 \ge \chi(G - v) + \chi(\overline G - v)$, and then $\chi(G) + \chi(\overline G) \le (n - 1) + 2 = n + 1$. $\blacksquare$

  - id: gt-078
    title: Nordhaus–Gaddum lower bound
    subtopic: Colouring & planarity
    difficulty: medium
    type: proof
    tags: [chromatic number, complement, cliques]
    related: [gt-077, gt-076]
    statement: |
      Prove that $\chi(G)\,\chi(\overline G) \ge n$.
    solution: |
      Each colour class of $G$ is independent in $G$, hence a clique in $\overline G$, so it has at most $\omega(\overline G) \le \chi(\overline G)$ vertices. The $\chi(G)$ classes cover all $n$ vertices: $n \le \chi(G)\chi(\overline G)$. $\blacksquare$

  - id: gt-079
    title: Planar bipartite graphs
    subtopic: Colouring & planarity
    difficulty: medium
    type: proof
    tags: [planar graphs, bipartite, euler formula]
    related: [gt-022, gt-023]
    statement: |
      Prove that a simple planar bipartite graph with $v \ge 3$ vertices has at most $2v - 4$ edges.
    solution: |
      We may assume it is connected (adding edges between components, keeping it bipartite and planar, only increases $e$) with $e \ge 3$ (else $e \le 2 \le 2v - 4$). It has no triangles, so every face is bounded by at least 4 edge-sides, and each edge has 2 sides: $4f \le 2e$. Euler: $2 = v - e + f \le v - e + \frac e2$, so $e \le 2v - 4$. $\blacksquare$

  - id: gt-080
    title: Planar graphs of large girth
    subtopic: Colouring & planarity
    difficulty: medium
    type: proof
    tags: [planar graphs, girth, euler formula]
    related: [gt-079, gt-081]
    statement: |
      The girth of a graph is the length of its shortest cycle. Prove that a connected planar graph with girth $g \ge 3$ (so it has a cycle) satisfies $e \le \frac{g}{g-2}(v - 2)$.
    solution: |
      Every face of a plane drawing is bounded by a closed walk containing a cycle, so by at least $g$ edge-sides; each edge has two sides: $gf \le 2e$. Euler: $2 = v - e + f \le v - e + \frac{2e}{g}$. Rearranging, $e\left(1 - \frac2g\right) \le v - 2$. $\blacksquare$

      ($g = 3$ gives $3v - 6$, $g = 4$ gives $2v - 4$.)

  - id: gt-081
    title: The Petersen graph is not planar
    subtopic: Colouring & planarity
    difficulty: medium
    type: proof
    tags: [planar graphs, petersen graph, girth]
    related: [gt-080]
    statement: |
      The Petersen graph has 10 vertices, 15 edges and girth 5. Prove that it is not planar.
    solution: |
      By gt-080 a planar graph with these parameters would have $e \le \frac53(10 - 2) = \frac{40}{3} < 14$. But $e = 15$. $\blacksquare$

  - id: gt-082
    title: Counting in a triangulation
    subtopic: Colouring & planarity
    difficulty: easy
    type: compute
    tags: [planar graphs, triangulations, euler formula]
    related: [gt-022]
    statement: |
      A plane triangulation is a connected plane graph (with $v \ge 3$) in which every face, including the outer one, is a triangle. Find $e$ and $f$ in terms of $v$.
    solution: |
      Every face has 3 edge-sides and every edge 2 sides: $3f = 2e$. Euler: $v - e + \frac{2e}{3} = 2$, so $e = 3v - 6$ and $f = 2v - 4$. (These are maximal planar graphs: the bound of gt-022 is attained.)

  - id: gt-083
    title: There are five Platonic solids
    subtopic: Colouring & planarity
    difficulty: hard
    type: proof
    tags: [platonic solids, euler formula, regular polyhedra]
    statement: |
      A convex polyhedron whose faces are all regular $p$-gons with $q$ meeting at each vertex ($p, q \ge 3$) gives a plane graph with every face of size $p$ and every vertex of degree $q$. Prove that $(p, q)$ is one of $(3,3), (3,4), (4,3), (3,5), (5,3)$.
    solution: |
      Counting edge-ends and edge-sides: $qv = 2e = pf$. Substituting into $v - e + f = 2$:
      $$\frac{2e}{q} - e + \frac{2e}{p} = 2 \implies \frac1p + \frac1q = \frac12 + \frac1e > \frac12.$$
      With $p, q \ge 3$: if $p \ge 6$ or $q \ge 6$ the sum is at most $\frac13 + \frac16 = \frac12$. Checking $3 \le p, q \le 5$: $\frac1p + \frac1q > \frac12$ holds only for $(3,3), (3,4), (4,3), (3,5), (5,3)$. These are the tetrahedron, octahedron, cube, icosahedron and dodecahedron. $\blacksquare$

  - id: gt-084
    title: Colouring interval graphs greedily
    subtopic: Colouring & planarity
    difficulty: medium
    type: proof
    tags: [interval graphs, greedy colouring, perfect graphs]
    related: [gt-027]
    statement: |
      Vertices are closed intervals on the line, adjacent when they overlap. Prove that colouring greedily in order of left endpoints uses exactly $\omega$ colours, the size of the largest clique.
    solution: |
      Clearly at least $\omega$ colours are needed. When interval $I = [a, b]$ is coloured, its already-coloured neighbours all start at or before $a$ and overlap $I$, so they all contain the point $a$. Together with $I$ they form a clique (intervals sharing a point pairwise overlap), of size at most $\omega$. So $I$ has at most $\omega - 1$ coloured neighbours, and some colour among $1, \dots, \omega$ is free. $\blacksquare$

  - id: gt-085
    title: The chromatic polynomial of a tree
    subtopic: Colouring & planarity
    difficulty: medium
    type: proof
    tags: [chromatic polynomial, trees, induction]
    related: [cb-114]
    statement: |
      Prove that a tree on $n$ vertices has exactly $k(k-1)^{n-1}$ proper colourings with $k$ colours.
    solution: |
      Induct on $n$; one vertex has $k$ colourings. Given a tree on $n \ge 2$ vertices, remove a leaf $\ell$. The rest has $k(k-1)^{n-2}$ colourings, and $\ell$ must avoid only its neighbour's colour: $k - 1$ choices. $\blacksquare$

      (So every tree with at least 2 vertices has chromatic number 2.)

  - id: gt-086
    title: Perfect matchings of complete bipartite graphs
    subtopic: Matchings & Ramsey
    difficulty: easy
    type: compute
    tags: [matchings, permutations]
    related: [cb-048]
    statement: |
      How many perfect matchings do $K_{n,n}$ and $K_{2n}$ have?
    solution: |
      $K_{n,n}$: each matching pairs the $n$ left vertices with the right ones bijectively: $n!$.

      $K_{2n}$: $(2n-1)(2n-3)\cdots1$ (cb-048).

  - id: gt-087
    title: Matchings and vertex covers
    subtopic: Matchings & Ramsey
    difficulty: easy
    type: proof
    tags: [matchings, vertex covers, duality]
    related: [gt-088]
    statement: |
      A vertex cover is a set of vertices meeting every edge. Prove that every matching is at most as large as every vertex cover, and show by example that equality may fail in non-bipartite graphs.
    solution: |
      A vertex cover must contain an endpoint of each edge of the matching, and these endpoints are distinct (matching edges are disjoint). So $|M| \le |C|$.

      **$K_3$:** a maximum matching has 1 edge, but a vertex cover needs 2 vertices. $\blacksquare$

  - id: gt-088
    title: Kőnig's theorem
    subtopic: Matchings & Ramsey
    difficulty: hard
    type: proof
    tags: [matchings, vertex covers, hall theorem]
    source: Kőnig, 1931
    related: [gt-029, gt-087]
    hints:
      - |
        Let $\tau$ be the minimum cover size. Apply Hall's theorem to $X$ with a "deficiency" version: add $|X| - \nu$ dummy vertices to $Y$ adjacent to all of $X$.
    statement: |
      Prove that in a bipartite graph the maximum size of a matching equals the minimum size of a vertex cover.
    solution: |
      By gt-087, $\nu \le \tau$. For the reverse, let $d = \max_{S\subseteq X}(|S| - |N(S)|) \ge 0$ (take $S = \varnothing$).

      **A matching of size $|X| - d$.** Add $d$ new vertices to $Y$ joined to everything in $X$. Now $|N(S)| \ge |S|$ for every non-empty $S$, so by Hall $X$ can be matched; at most $d$ of these edges use new vertices, leaving a matching of size $\ge |X| - d$ in $G$.

      **A cover of size $|X| - d$.** Take $S$ attaining $d$. Then $(X\setminus S) \cup N(S)$ covers every edge (an edge from $S$ goes to $N(S)$), and has size $|X| - |S| + |N(S)| = |X| - d$.

      So $\nu \ge |X| - d \ge \tau$. $\blacksquare$

  - id: gt-089
    title: Berge's augmenting path lemma
    subtopic: Matchings & Ramsey
    difficulty: hard
    type: proof
    tags: [matchings, augmenting paths, symmetric difference]
    source: Berge, 1957
    statement: |
      An augmenting path for a matching $M$ is a path that starts and ends at vertices not covered by $M$ and alternates between edges not in $M$ and edges in $M$. Prove that $M$ is a maximum matching iff it has no augmenting path.
    solution: |
      **Augmenting path ⇒ not maximum.** Swapping the path's edges in and out of $M$ ($M \triangle P$) gives a matching with one more edge.

      **Not maximum ⇒ augmenting path.** Let $M'$ be larger. In $M \triangle M'$ every vertex has degree at most 2 (at most one edge from each), so its components are paths and cycles alternating between $M$ and $M'$. Cycles have equally many edges of each; since $|M'| > |M|$, some path component has more $M'$-edges than $M$-edges. Such a path starts and ends with $M'$-edges at vertices not covered by $M$ (else the path would continue), so it is augmenting for $M$. $\blacksquare$

  - id: gt-090
    title: Trees have at most one perfect matching
    subtopic: Matchings & Ramsey
    difficulty: medium
    type: proof
    tags: [matchings, trees, uniqueness]
    related: [gt-089]
    statement: |
      Prove that a tree has at most one perfect matching.
    solution: |
      If $M \ne M'$ were both perfect, $M\triangle M'$ would be non-empty with every vertex of degree 0 or 2 in it (each vertex is in exactly one edge of each). A non-empty graph with all degrees 0 or 2 contains a cycle, but a tree has none. $\blacksquare$

  - id: gt-091
    title: The mutilated chessboard
    subtopic: Matchings & Ramsey
    difficulty: easy
    type: proof
    tags: [domino tilings, colouring, perfect matchings]
    statement: |
      Two opposite corners are removed from an $8\times8$ chessboard. Prove that the remaining 62 squares cannot be tiled by 31 dominoes.
    solution: |
      Opposite corners have the same colour, so 32 squares of one colour and 30 of the other remain. Every domino covers one square of each colour, so 31 dominoes cover 31 of each. $\blacksquare$

      (A domino tiling is a perfect matching in the grid graph, which is bipartite.)

  - id: gt-092
    title: Latin rectangles extend
    subtopic: Matchings & Ramsey
    difficulty: hard
    type: proof
    tags: [latin squares, hall theorem, regular bipartite]
    related: [gt-030]
    statement: |
      A $k\times n$ Latin rectangle ($k < n$) has entries from $\{1, \dots, n\}$ with no repeats in any row or column. Prove that a new row can always be added, so every Latin rectangle extends to a Latin square.
    solution: |
      Build a bipartite graph with columns on one side and symbols on the other, joining column $j$ to symbol $s$ if $s$ does not yet appear in column $j$. Each column misses $n - k$ symbols. Each symbol appears once in each row, so in $k$ columns, and is missing from $n - k$ columns. So the graph is $(n-k)$-regular, and by gt-030 it has a perfect matching: assign to each column a missing symbol, all different. That is a valid new row. Repeating gives a Latin square. $\blacksquare$

  - id: gt-093
    title: A lower bound for R(3, 4)
    subtopic: Matchings & Ramsey
    difficulty: medium
    type: proof
    tags: [ramsey numbers, circulant graphs]
    related: [cb-098]
    statement: |
      On vertices $\Z_8$ join $i$ and $j$ when $i - j \equiv \pm1$ or $4 \pmod 8$. Show this graph has no triangle and no independent set of 4 vertices, and deduce $R(3,4) \ge 9$.
    solution: |
      **No triangle.** Going round a triangle $i \to j \to k \to i$, the three differences are each $1$, $4$ or $7$ mod 8 and sum to $0$. But the sums of three values from $\{1, 4, 7\}$ are $3, 6, 9, 9, 12, 15, 12, 15, 18, 21$, i.e. $3, 6, 1, 1, 4, 7, 4, 7, 2, 5 \pmod 8$, never $0$.

      **No independent 4-set.** Translate so one vertex is $0$. The other three lie among the non-neighbours of $0$, namely $\{2, 3, 5, 6\}$, and must be pairwise non-adjacent. The adjacent pairs there are $\{2,3\}$, $\{5,6\}$ (difference 1) and $\{2,6\}$ (difference 4), leaving only $\{2,5\}, \{3,5\}, \{3,6\}$ non-adjacent. No three of $2, 3, 5, 6$ are pairwise non-adjacent.

      Colouring the edges of $K_8$ red when they are in this graph and blue otherwise gives no red triangle and no blue $K_4$, so $R(3,4) > 8$. $\blacksquare$

      (A sharpening of cb-098 shows $R(3,4) \le 9$, so in fact $R(3,4) = 9$.)

  - id: gt-094
    title: Schur's theorem for two colours
    subtopic: Matchings & Ramsey
    difficulty: medium
    type: proof
    tags: [schur, ramsey theory, colouring]
    source: Schur, 1916
    statement: |
      Prove that if $\{1, 2, 3, 4, 5\}$ is coloured red and blue, there are $x, y, z$ of one colour (not necessarily distinct) with $x + y = z$. Show that $\{1, 2, 3, 4\}$ can be coloured to avoid this.
    solution: |
      Suppose not, and say 1 is red. Then 2 is blue ($1 + 1 = 2$), so 4 is red ($2 + 2 = 4$), so 3 is blue ($1 + 3 = 4$), and 5 is blue ($1 + 4 = 5$). But $2 + 3 = 5$ is all blue. Contradiction.

      **$\{1,2,3,4\}$:** red $\{1, 4\}$, blue $\{2, 3\}$. Red sums: $1+1 = 2$, $1 + 4 = 5$, $4 + 4 = 8$, none red. Blue sums: $2 + 2 = 4$, $2 + 3 = 5$, $3 + 3 = 6$, none blue. $\blacksquare$

  - id: gt-095
    title: The infinite Ramsey theorem
    subtopic: Matchings & Ramsey
    difficulty: hard
    type: proof
    tags: [ramsey theory, infinite pigeonhole]
    source: Ramsey, 1930
    related: [cb-101]
    statement: |
      The edges of the complete graph on $\N$ are coloured red and blue. Prove there is an infinite set all of whose edges have the same colour.
    solution: |
      Build $v_1, v_2, \dots$ and infinite sets $S_0 = \N \supset S_1 \supset \cdots$. Given infinite $S_{i-1}$, pick $v_i \in S_{i-1}$. Its edges to the infinitely many other elements of $S_{i-1}$ have two colours, so infinitely many have one colour $c_i$; let $S_i$ be those elements.

      For $i < j$, $v_j \in S_i$, so the edge $v_iv_j$ has colour $c_i$. Infinitely many $i$ share the same $c_i$ (pigeonhole), and those $v_i$ span a monochromatic infinite set. $\blacksquare$

  - id: gt-096
    title: Stable marriages exist
    subtopic: Matchings & Ramsey
    difficulty: hard
    type: proof
    tags: [stable matching, gale-shapley, algorithms]
    source: Gale, Shapley, 1962
    statement: |
      $n$ proposers and $n$ receivers each rank the other side. A perfect matching is **unstable** if some proposer $p$ and receiver $r$, not matched together, each prefer the other to their partner. In the Gale–Shapley algorithm, each unmatched proposer proposes to the best receiver not yet tried; each receiver keeps the best offer so far and rejects the rest. Prove that it ends with a stable perfect matching.
    solution: |
      **Termination.** Each proposer proposes to each receiver at most once, so there are at most $n^2$ proposals.

      **Perfect.** Once proposed to, a receiver stays matched (only trading up). If some proposer $p$ ended unmatched, $p$ was rejected by all $n$ receivers, so all $n$ are matched, to $n$ proposers other than $p$: impossible.

      **Stable.** Suppose $p$ prefers $r$ to his final partner. Then $p$ proposed to $r$ earlier and was rejected (immediately or later) in favour of someone $r$ preferred; and $r$'s partner only improves. So $r$ prefers her final partner to $p$. No unstable pair exists. $\blacksquare$

  - id: gt-097
    title: Edge-colouring regular bipartite graphs
    subtopic: Matchings & Ramsey
    difficulty: medium
    type: proof
    tags: [edge colouring, regular bipartite, perfect matchings]
    related: [gt-030]
    statement: |
      Prove that the edges of a $k$-regular bipartite graph can be coloured with $k$ colours so that edges sharing a vertex get different colours.
    solution: |
      Induct on $k$; for $k = 0$ there are no edges. For $k \ge 1$, gt-030 gives a perfect matching $M$; colour it with colour $k$. Removing $M$ leaves a $(k-1)$-regular bipartite graph, which by hypothesis is $(k-1)$-edge-colourable with the other colours. Edges of $M$ are disjoint, so the combined colouring is proper. $\blacksquare$

  - id: gt-098
    title: Greedy matchings are half-optimal
    subtopic: Matchings & Ramsey
    difficulty: medium
    type: proof
    tags: [matchings, greedy algorithms, approximation]
    related: [gt-087]
    statement: |
      A matching is maximal if no edge can be added to it. Prove that every maximal matching has at least half as many edges as a maximum matching.
    solution: |
      Let $M$ be maximal and $V(M)$ its $2|M|$ endpoints. Every edge of $G$ meets $V(M)$ (else it could be added), so $V(M)$ is a vertex cover. By gt-087 every matching has at most $|V(M)| = 2|M|$ edges. $\blacksquare$

  - id: gt-099
    title: Choosing one card of each rank
    subtopic: Matchings & Ramsey
    difficulty: medium
    type: proof
    tags: [hall theorem, systems of distinct representatives]
    related: [gt-030]
    statement: |
      A standard deck is dealt into 13 piles of 4 cards. Prove that one can choose one card from each pile so that the 13 chosen cards have all 13 ranks.
    solution: |
      Make a bipartite graph between piles and ranks, joining a pile to a rank once for each card of that rank in the pile (a multigraph). Each pile has 4 cards, and each rank has 4 cards, so the multigraph is 4-regular. Hall's condition holds as in gt-030 (multi-edges don't affect the counting argument), so there is a perfect matching: each pile is assigned a distinct rank that it contains. $\blacksquare$

  - id: gt-100
    title: A bound for R(4, 4)
    subtopic: Matchings & Ramsey
    difficulty: easy
    type: compute
    tags: [ramsey numbers]
    related: [gt-028, gt-093]
    statement: |
      Use gt-028 and $R(3,4) = 9$ to bound $R(4,4)$. What bound do you get from $R(3,4) \le 10$ alone?
    solution: |
      $R(4,4) \le R(3,4) + R(4,3) = 9 + 9 = 18$. (This is exact: $R(4,4) = 18$.)

      Using only $R(3,4) \le 10$ gives $R(4,4) \le 20$.
