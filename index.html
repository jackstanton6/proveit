<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A bank of proof problems for undergraduates." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ProveIt</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('proveit:settings') || '{}');
        document.documentElement.dataset.theme = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.font = s.font || 'academic';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
